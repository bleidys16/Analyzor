name = "analyzor-llm"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Orígenes que pueden llamar al proxy (separados por coma; admite * en un subdominio).
# Solo el dominio exacto del frontend. No uses comodines como https://analyzor-*.vercel.app:
# cualquiera podría crear un proyecto con ese patrón y gastar tu cuota de IA.
ALLOWED_ORIGINS = "http://localhost:5173,https://analyzor.vercel.app"
# Groq retiró llama-3.3-70b-versatile el 16/08/2026. Revisa https://console.groq.com/docs/deprecations
GROQ_MODEL = "openai/gpt-oss-120b"

# Cuotas diarias de llamadas de IA (cada pregunta del chat usa 1 o 2 llamadas). Se reinician a las 00:00 UTC.
DAILY_LIMIT_PER_IP = "60"    # por usuario (dirección IP)
DAILY_LIMIT_GLOBAL = "1500"  # de todo el servicio: protege la cuota gratuita de Groq

# La clave NO va aquí: wrangler secret put GROQ_API_KEY

# Contadores de uso: un Durable Object con almacenamiento SQLite (el único tipo del plan gratuito)
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]
